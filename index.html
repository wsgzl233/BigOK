<style>
/* 合成大OK · 样式表 */
/* =========================================================
 *  配色与版面沿用源站：奶油底 + 玻璃面板 + 珊瑚红主按钮
 * ======================================================= */

/* 启动失败提示条（正常情况下 hidden） */
.fatal {
  position: fixed;
  left: 12px; right: 12px; bottom: 12px;
  z-index: 50;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid #ffb3ae;
  background: #fff1f0;
  color: #a8231a;
  font-size: 13px;
  line-height: 1.6;
  box-shadow: 0 10px 24px rgba(160, 40, 30, .18);
  word-break: break-all;
}

:root {
  --ink:        #4a3325;
  --ink-soft:   #8a7566;
  --brand:      #ff6b6b;
  --brand-dark: #e14b4b;
  --card:       rgba(255, 255, 255, .74);
  --shadow:     0 18px 50px rgba(126, 84, 44, .18);
  --vh:         100vh;
  --safe-t:     env(safe-area-inset-top, 0px);
  --safe-b:     env(safe-area-inset-bottom, 0px);
  --safe-l:     env(safe-area-inset-left, 0px);
  --safe-r:     env(safe-area-inset-right, 0px);
}
@supports (height: 100dvh) { :root { --vh: 100dvh; } }

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { height: 100%; overscroll-behavior: none; }

body {
  margin: 0;
  padding: 16px;
  color: var(--ink);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background:
    radial-gradient(1200px 700px at 8% -12%,  #ffe9bd 0%, transparent 60%),
    radial-gradient(900px 600px at 104% -6%,  #d5f0ff 0%, transparent 55%),
    radial-gradient(1000px 780px at 50% 118%, #ffdbe6 0%, transparent 62%),
    #fff9f1;
  display: grid;
  place-items: center;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

/* ---------------- 布局 ---------------- */

.app {
  display: flex;
  align-items: stretch;
  gap: 20px;
  max-height: 100%;
}

.stage {
  position: relative;
  height: min(90vh, 900px);
  aspect-ratio: 470 / 780;
  flex: 0 0 auto;
  border-radius: 24px;
  background: #fff3df;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  touch-action: none;
  box-shadow:
    0 26px 64px rgba(122, 80, 40, .30),
    0 0 0 1px rgba(255, 255, 255, .7) inset,
    0 0 0 6px rgba(255, 255, 255, .55);
}
.stage:active { cursor: grabbing; }

#c { display: block; width: 100%; height: 100%; }

/* ---------------- 侧边面板 ---------------- */

.panel {
  width: min(300px, 86vw);
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px;
  border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, .8);
  background: var(--card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  overflow-y: auto;              /* 窗口很矮时面板自己滚，别把内容顶出屏幕 */
  overscroll-behavior: contain;
}

.panel-head h1 {
  margin: 0;
  font-size: 25px;
  letter-spacing: .04em;
  background: linear-gradient(100deg, #ff7a59, #ff4d6d 55%, #b13bff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  margin: 5px 0 0;
  font-size: 12.5px;
  color: var(--ink-soft);
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat {
  padding: 9px 12px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .82);
  box-shadow: 0 4px 14px rgba(140, 96, 56, .10);
}

.stat-label {
  display: block;
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--ink-soft);
}

.stat-value {
  display: block;
  margin-top: 2px;
  font-size: 26px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  transform-origin: left center;
}

.stat-best { color: #e79a1f; }

.stat-value.bump { animation: bump .32s ease; }
@keyframes bump {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.22); color: var(--brand); }
  100% { transform: scale(1); }
}

.box-label {
  display: block;
  margin-bottom: 6px;
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--ink-soft);
}

.next-box,
.chain-box {
  padding: 10px 12px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .82);
  box-shadow: 0 4px 14px rgba(140, 96, 56, .10);
}

#chain { display: block; width: 100%; height: auto; }

.chain-note {
  margin: 6px 0 0;
  font-size: 11.5px;
  line-height: 1.5;
  text-align: center;
  color: var(--ink-soft);
}
.chain-note strong { color: #c8601a; }

/* ---------------- 按钮 ---------------- */

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn {
  padding: 11px 12px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  border: 1px solid rgba(255, 255, 255, .9);
  border-radius: 14px;
  background: rgba(255, 255, 255, .9);
  box-shadow: 0 6px 16px rgba(140, 96, 56, .14);
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
}
.btn .ico { margin-right: 4px; }
.btn:hover  { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(140, 96, 56, .2); }
.btn:active { transform: translateY(1px) scale(.985); }
.btn-wide { grid-column: 1 / -1; }
.btn-primary {
  color: #fff;
  border-color: transparent;
  background: linear-gradient(135deg, #ff8a5b, var(--brand) 55%, var(--brand-dark));
}

.tips {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.7;
  text-align: center;
  color: var(--ink-soft);
}
.tips strong { color: #c8601a; }

/* ---------------- 排行榜弹窗 ---------------- */

.modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  place-items: center;
  padding: 20px;
  background: rgba(60, 36, 20, .42);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.modal.show { display: grid; }

.modal-card {
  width: min(420px, 100%);
  padding: 18px;
  border-radius: 22px;
  background: rgba(255, 252, 246, .98);
  box-shadow: 0 24px 60px rgba(90, 56, 28, .38);
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.modal-head h2 { margin: 0; font-size: 18px; }

.icon-btn {
  width: 34px; height: 34px;
  font: inherit;
  font-size: 15px;
  color: var(--ink-soft);
  border: 0;
  border-radius: 11px;
  background: rgba(255, 255, 255, .9);
  box-shadow: 0 3px 10px rgba(140, 96, 56, .14);
  cursor: pointer;
}

.board-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 52vh;
  overflow: auto;
}

.board-row {
  display: grid;
  grid-template-columns: 26px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 12px;
  background: rgba(255, 255, 255, .85);
  box-shadow: inset 0 0 0 1px rgba(216, 176, 128, .18);
  font-size: 13px;
}
.board-row.is-top {
  background: linear-gradient(135deg, #fff3d0, #ffe0a8);
  box-shadow: inset 0 0 0 1px rgba(214, 160, 96, .35);
}
.board-rank { text-align: center; font-weight: 800; color: #c98a2a; }
.board-score { font-variant-numeric: tabular-nums; font-weight: 700; }
.board-date { font-size: 11px; color: var(--ink-soft); }

.board-empty { padding: 26px 10px; text-align: center; color: var(--ink-soft); font-size: 13px; }

.modal-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
}
.board-note { font-size: 11px; color: var(--ink-soft); line-height: 1.5; }

/* =========================================================
 *  窄屏：面板压成顶部信息条，棋盘吃满剩下的高度
 * ======================================================= */
@media (max-width: 860px) {
  :root { --topbar: 66px; }

  body {
    padding: calc(8px + var(--safe-t)) calc(8px + var(--safe-r))
             calc(8px + var(--safe-b)) calc(8px + var(--safe-l));
  }

  .app {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    width: 100%;
    height: 100%;
    max-height: none;
  }

  .panel { order: -1; }

  .stage {
    margin: auto 0;
    aspect-ratio: 380 / 700;          /* 默认比例：宽度优先，保证 94vw */
    height: min(calc(var(--vh) - var(--topbar) - 26px - var(--safe-t) - var(--safe-b)),
                calc(94vw * 700 / 380));
    width: auto;
    border-radius: 20px;
  }

  .panel {
    flex-direction: row;
    align-items: stretch;
    gap: 8px;
    width: 100%;
    max-width: 94vw;
    padding: 8px 10px;
    border-radius: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .panel-head,
  .next-box,
  .chain-box,
  .tips { display: none; }

  .stats {
    flex: 1 1 auto;
    display: flex;
    gap: 8px;
    min-width: 0;
  }

  .stat {
    flex: 1 1 0;
    min-width: 0;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, .9);
    box-shadow: 0 2px 8px rgba(140, 96, 56, .12);
  }

  .stat-label { font-size: 10px; letter-spacing: .08em; }
  .stat-value { margin-top: 0; font-size: 20px; line-height: 1.15; }

  .actions { flex: 0 0 auto; display: flex; gap: 6px; }

  .btn {
    min-height: 46px;
    padding: 0 12px;
    font-size: 14px;
    border-radius: 13px;
    white-space: nowrap;
  }

  #boardBtn .lbl,
  #soundBtn .lbl { display: none; }

  #boardBtn, #soundBtn {
    min-width: 46px;
    padding: 0 10px;
    font-size: 17px;
  }
  #boardBtn .ico, #soundBtn .ico { margin-right: 0; }
}

/* 细长屏（比 48:100 还窄的机型）：切到加长比例，
   多出来的高度全部变成堆积空间，宽度仍是 94vw */
@media (max-width: 860px) and (max-aspect-ratio: 50/100) {
  .stage {
    aspect-ratio: 380 / 780;
    height: min(calc(var(--vh) - var(--topbar) - 26px - var(--safe-t) - var(--safe-b)),
                calc(94vw * 780 / 380));
  }
}

/* 手机横屏：回到左右布局，棋盘吃满高度 */
@media (max-width: 860px) and (orientation: landscape) {
  .app {
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .panel {
    order: 0;
    flex-direction: column;
    width: min(220px, 30vw);
    max-width: none;
    padding: 10px;
    gap: 8px;
  }
  .stats { flex-direction: column; flex: 0 0 auto; }
  .actions { flex-direction: column; }
  .stage {
    height: calc(var(--vh) - 16px - var(--safe-t) - var(--safe-b));
    width: auto;
  }
  .stat-value { font-size: 18px; }

  #boardBtn, #soundBtn { min-width: 0; padding: 0 10px; font-size: 13px; }
  #boardBtn .lbl, #soundBtn .lbl { display: inline; }
  #boardBtn .ico, #soundBtn .ico { margin-right: 4px; }
}

/* 小屏手机：再压一档 */
@media (max-width: 380px) {
  .panel { padding: 6px 8px; gap: 6px; }
  .stats { gap: 6px; }
  .stat { padding: 5px 8px; }
  .stat-value { font-size: 17px; }
  .stat-label { font-size: 9px; }
  .btn { min-height: 44px; padding: 0 10px; font-size: 13px; }
  #boardBtn, #soundBtn { min-width: 42px; font-size: 16px; }
}

/* 很矮的横屏 */
@media (max-width: 860px) and (orientation: landscape) and (max-height: 430px) {
  .stat-label { display: none; }
  .stat { padding: 4px 8px; }
  .stat-value { font-size: 16px; }
  .btn { min-height: 40px; padding: 0 10px; font-size: 13px; }
}

/* 合成表现在是面板主角，矮窗口也不再隐藏；面板自带滚动兜底 */
/* 再矮就把棋盘抬到 92vh，靠面板自己滚兜底 */
@media (max-height: 620px) and (min-width: 861px) {
  .stage { height: 92vh; }
}
</style>
</head>
<body>

<main class="app">

  <!-- ===== 棋盘 ===== -->
  <section class="stage" id="stage">
    <canvas id="c" aria-label="合成大OK游戏区域"></canvas>
  </section>

  <!-- ===== 侧边面板 ===== -->
  <aside class="panel">

    <header class="panel-head">
      <h1>合成大OK</h1>
      <p class="subtitle">相同的撞在一起，越合越大</p>
    </header>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">分数</span>
        <strong class="stat-value" id="score">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">最高分</span>
        <strong class="stat-value stat-best" id="best">0</strong>
      </div>
    </div>

    <div class="chain-box">
      <span class="box-label">合成表</span>
      <canvas id="chain" width="680" height="470" aria-label="合成顺序"></canvas>
      <p class="chain-note">✨ 两个原型钛体撞在一起会一起炸掉，换 <strong>120 分</strong></p>
    </div>

    <div class="actions">
      <button class="btn btn-wide" id="boardBtn" type="button">
        <span class="ico">🏆</span><span class="lbl">排行榜</span>
      </button>
      <button class="btn" id="soundBtn" type="button" aria-pressed="true">
        <span class="ico" id="soundIco">🔊</span><span class="lbl" id="soundLbl">音效开</span>
      </button>
      <button class="btn btn-primary" id="resetBtn" type="button" title="重新开始（R）">
        <span class="ico">↻</span><span class="lbl">重开</span>
      </button>
    </div>

    <p class="tips">
      鼠标：移动瞄准、点击投放；触屏：拖动瞄准、松手投放。<br>
      ← → 微调位置，空格投放，R 重开。<br>
      合成得越大，一次加分越多。
    </p>

  </aside>

</main>

<!-- ===== 排行榜弹窗（本地存档） ===== -->
<div class="modal" id="boardModal" role="dialog" aria-modal="true" aria-label="排行榜" aria-hidden="true">
  <div class="modal-card">
    <header class="modal-head">
      <h2>🏆 本机最高分</h2>
      <button class="icon-btn" id="boardClose" type="button" aria-label="关闭">✕</button>
    </header>
    <div class="board-list" id="boardList"></div>
    <footer class="modal-foot">
      <span class="board-note">只记录这台设备上的前 10 局</span>
      <button class="btn" id="boardAgain" type="button">再来一局</button>
    </footer>
  </div>
</div>

<div class="fatal" id="fatal" hidden></div>

<script>
/* 启动失败时给一句人话，别让人对着白屏猜 */
window.addEventListener('error', function (e) {
  var box = document.getElementById('fatal');
  if (!box || !box.hidden) return;
  var t = e.target;
  var isRes = t && t !== window && t.tagName === 'SCRIPT';
  box.textContent = isRes
    ? '脚本没加载出来：' + (t.src || '') + ' — 确认 assets 目录和 index.html 一起上传/解压了。'
    : '出错了：' + (e.message || e.type);
  box.hidden = false;
}, true);
</script>
<script>

  const $ = (id) => document.getElementById(id);

  const chainCtx   = chainCanvas.getContext('2d');

  let scale = 1;

  function fit() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    /* 高度固定 700，宽度按元素比例反推 —— CSS 换成 440/700 就是“只加宽不加长” */
    W = Math.round(H * (rect.width / rect.height));
    scale = canvas.width / W;
  }

  /* ---------- 3. 存储 ----------
     localStorage 在 file://、隐私模式、“禁止所有 Cookie”、部分 App 内置浏览器里
     会直接抛异常。而它是在启动阶段读的 —— 一抛，整个脚本就停，页面一片空白，
     看起来就像“打不开”。所以先探一次，不行就退回内存存储。 */
  const Store = (() => {
    let ok = false;
    const mem = Object.create(null);
    try {
      const probe = '__suika_probe__';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      ok = true;
    } catch (e) {
      ok = false;
    }
    return {
      ok,
      get(k) {
        try {
          return ok ? window.localStorage.getItem(k) : (k in mem ? mem[k] : null);
        } catch (e) {
          return k in mem ? mem[k] : null;
        }
      },
      set(k, v) {
        try {
          if (ok) window.localStorage.setItem(k, String(v));
          else mem[k] = String(v);
        } catch (e) {
          mem[k] = String(v);
        }
      }
    };
  })();

  /* ---------- 4. 状态 ---------- */

    balls: [], particles: [], floats: [],
    score: 0, best: Number(Store.get(BEST_KEY) || 0),
    pending: 0, next: 0,
    aimX: W / 2, ready: true, cooldown: 0,
    over: false, ended: false, danger: false, flash: 0
  };

  function rand(a, b) { return a + Math.random() * (b - a); }
  function rollTier() {
    let r = Math.random(), acc = 0;
    for (let i = 0; i < SPAWN_TIERS.length; i++) {
      acc += SPAWN_WEIGHTS[i];
      if (r <= acc) return SPAWN_TIERS[i];
    }
    return 0;
  }

  /* ---------- 4. 音效（WebAudio 现场合成，无音频文件） ---------- */
  const Sound = {
    ctx: null,
    muted: Store.get(MUTE_KEY) === '1',

    ensure() {
      if (this.ctx) return this.ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { this.ctx = new AC(); } catch (e) { this.ctx = null; }
      return this.ctx;
    },

    tone(freq, freq2, dur, vol, type) {
      if (this.muted) return;
      const c = this.ensure();
      if (!c) return;
      if (c.state === 'suspended') c.resume();
      const t = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      if (freq2 && freq2 !== freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t + dur);
      }
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    },

    drop()      { this.tone(340, 210, 0.09, 0.16, 'sine'); },
    merge(tier) { const f = 190 + tier * 42; this.tone(f, f * 1.6, 0.16, 0.20, 'triangle'); },
    bonus()     { this.tone(520, 900, 0.35, 0.22, 'triangle'); },
    over()      { this.tone(420, 110, 0.55, 0.20, 'sawtooth'); },

    toggle() {
      this.muted = !this.muted;
      Store.set(MUTE_KEY, this.muted ? '1' : '0');
      paintSound();
      if (!this.muted) { this.ensure(); this.tone(660, 880, 0.09, 0.14); }
      return this.muted;
    }
  };

  function paintSound() {
    if (!soundBtn) return;
    const ico = $('soundIco'), lbl = $('soundLbl');
    soundBtn.setAttribute('aria-pressed', Sound.muted ? 'false' : 'true');
    if (ico) ico.textContent = Sound.muted ? '🔇' : '🔊';
    if (lbl) lbl.textContent = Sound.muted ? '音效关' : '音效开';
  }

  /* ---------- 5. 刚体 ---------- */
  /* 贴图边长：碰撞体也按这个尺度生成，所以画面和碰撞严丝合缝 */
  function spriteBox(tier) {
    const r = FRUITS[tier].r;
    // 小号提一点（最小 +15%），大号收一点；第 4 张往后整体再缩 8%
    const boost = (1.15 - 0.15 * (r / FRUITS[MAX_TIER].r)) * (tier >= 3 ? 0.92 : 1);
    return (r * 2) * SPRITE_SCALE * boost;
  }

  function shapeOf(tier) {
    const sh = SHAPES[tier];
    return (sh && sh.parts && sh.parts.length) ? sh : { rb: 0.62, parts: [[0, 0, 0.5]] };
  }

  function makeBall(x, y, tier, vx, vy) {
    const r = FRUITS[tier].r;
    const m = r * r;                    // 质量 ~ 面积
    const box = spriteBox(tier);
    const sh = shapeOf(tier);
    const parts = sh.parts.map((p) => ({ ox: p[0] * box, oy: p[1] * box, rr: p[2] * box }));

    let rb = 0, topExt = 0, botExt = 0, halfW = 0;
    for (const p of parts) {
      rb = Math.max(rb, Math.hypot(p.ox, p.oy) + p.rr);
      topExt = Math.max(topExt, -p.oy + p.rr);
      botExt = Math.max(botExt, p.oy + p.rr);
      halfW = Math.max(halfW, Math.abs(p.ox) + p.rr);
    }

    return {
      x, y, px: x, py: y,
      vx: vx || 0, vy: vy || 0, pvx: 0, pvy: 0,
      r, box, tier, m, invMass: 1 / m,
      parts, rb, topExt, botExt, halfW,
      dead: false, hit: false,
      landed: false, bornAt: performance.now(),
      overTime: 0, popAt: 0
    };
  }

  /* 只为了拿宽度，不建刚体 */
  const halfWCache = [];
  function halfWidthOf(tier) {
    if (halfWCache[tier] === undefined) {
      const box = spriteBox(tier), sh = shapeOf(tier);
      let w = 0;
      for (const p of sh.parts) w = Math.max(w, Math.abs(p[0] * box) + p[2] * box);
      halfWCache[tier] = w;
    }
    return halfWCache[tier];
  }

  /* ---------- 6. 物理核心（PBD） ---------- */
  function substep(dt) {
    const balls = state.balls;
    const contacts = [];
    const merges = [];

    // 6.1 积分：先按速度走一步，记下“走过的位置”
    for (const b of balls) {
      b.px = b.x; b.py = b.y;
      b.vy += GRAVITY * dt;
      b.pvx = b.vx; b.pvy = b.vy;      // 求解前的速度，弹性冲量要用
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.hit = false;
    }

    // 6.2 约束求解：反复把“穿模”推开
    for (let it = 0; it < ITER; it++) {
      /* 墙 / 地：每个子圆各自算穿透，取最深的那一处一次性推刚体 */
      for (const b of balls) {
        if (b.dead) continue;
        let pushL = 0, pushR = 0, pushF = 0;
        for (const p of b.parts) {
          const px = b.x + p.ox, py = b.y + p.oy;
          pushL = Math.max(pushL, WALL - (px - p.rr));
          pushR = Math.max(pushR, (px + p.rr) - (W - WALL));
          pushF = Math.max(pushF, (py + p.rr) - (H - WALL));
        }
        if (pushL || pushR || pushF) {
          b.x += pushL - pushR;
          b.y -= pushF;
          b.hit = true;
          if (it === 0) {
            if (pushL) contacts.push({ b, nx: 1, ny: 0 });
            if (pushR) contacts.push({ b, nx: -1, ny: 0 });
            if (pushF) contacts.push({ b, nx: 0, ny: -1 });
          }
        }
      }

      // 球球：两两求交，按逆质量分配推开量
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i];
        if (a.dead) continue;
        for (let j = i + 1; j < balls.length; j++) {
          const b = balls[j];
          if (b.dead) continue;

          const dx = b.x - a.x, dy = b.y - a.y;
          const rbSum = a.rb + b.rb;
          if (dx * dx + dy * dy >= rbSum * rbSum) continue;   // 包围圆粗筛

          /* 子圆两两比较：取「最接近/最深」的那一对。
             gap > 0 表示没碰上但很接近 —— 解算会把两块推到 +0.05，
             所以合成必须按「距离 + 容差」判，只认重叠的话永远合不了。 */
          let gap = 1e9, nx = 0, ny = 0;
          for (const pa of a.parts) {
            const ax = a.x + pa.ox, ay = a.y + pa.oy;
            /* 粗筛：这个子圆离对方重心太远，整组跳过 */
            const fdx = b.x - ax, fdy = b.y - ay, far = b.rb + pa.rr + MERGE_PAD;
            if (fdx * fdx + fdy * fdy >= far * far) continue;
            for (const pb of b.parts) {
              const bx = b.x + pb.ox, by = b.y + pb.oy;
              const ddx = bx - ax, ddy = by - ay;
              const sum = pa.rr + pb.rr;
              const d2 = ddx * ddx + ddy * ddy;
              const lim = sum + MERGE_PAD;
              if (d2 >= lim * lim) continue;
              const d = Math.sqrt(d2) || 1e-4;
              const g = d - sum;
              if (g < gap) { gap = g; nx = ddx / d; ny = ddy / d; }
            }
          }
          if (gap === 1e9) continue;

          // 同级 + 贴着（含容差）→ 合成。只在第 0 次迭代判一次，避免重复合成
          if (it === 0 && a.tier === b.tier && gap <= MERGE_PAD) {
            a.dead = true; b.dead = true;
            merges.push([a, b]);
            continue;
          }

          if (gap >= 0) continue;                 // 只是贴近，不用推开
          const corr = Math.min(-gap, 5) * 0.95;  // 单次修 95%，重叠消得更干净
          if (corr <= 0) continue;
          const invSum = a.invMass + b.invMass;
          const wa = a.invMass / invSum;
          a.x -= nx * corr * wa;  a.y -= ny * corr * wa;
          b.x += nx * corr * (1 - wa); b.y += ny * corr * (1 - wa);
          a.hit = b.hit = true;
          if (it === 0) contacts.push({ a, b, nx, ny });
        }
      }
    }

    // 6.3 收尾贴墙：球球分离可能把水果顶出墙外
    for (const b of balls) {
      if (b.dead) continue;
      b.x = Math.min(Math.max(b.x, WALL + b.halfW), W - WALL - b.halfW);
      if (b.y + b.botExt > H - WALL) b.y = H - WALL - b.botExt;
    }

    // 6.4 由位置差反推速度 —— PBD 的招牌动作
    const invDt = 1 / dt;
    for (const b of balls) {
      if (b.dead) continue;
      const dx = b.x - b.px, dy = b.y - b.py;
      b.vx = dx * invDt;
      b.vy = dy * invDt;
      if (b.hit) b.vx *= FRICTION;       // 接触时的切向摩擦
      if (!b.landed && (b.hit || performance.now() - b.bornAt > 900)) b.landed = true;
    }

    // 6.5 弹性冲量：把法向速度改写成 e × 撞前速度
    //     位置约束会吃掉法向速度，不补这一下，球就是“啪”地粘住，没有 Q 弹感
    for (const c of contacts) {
      if (c.b) {
        const b = c.b;
        if (b.dead) continue;
        const vnPre = b.pvx * c.nx + b.pvy * c.ny;
        if (vnPre < -REST_THRESHOLD) {
          const vnPost = b.vx * c.nx + b.vy * c.ny;
          const j = (-WALL_RESTITUTION * vnPre) - vnPost;
          if (j > 0) { b.vx += j * c.nx; b.vy += j * c.ny; }
        }
      } else {
        const a = c.a, b = c.b;
        if (a.dead || b.dead) continue;
        const vnPre = (a.pvx - b.pvx) * c.nx + (a.pvy - b.pvy) * c.ny;  // >0 相互靠近
        if (vnPre > REST_THRESHOLD) {
          const vnPost = (a.vx - b.vx) * c.nx + (a.vy - b.vy) * c.ny;
          const j = (vnPost + RESTITUTION * vnPre) / (a.invMass + b.invMass);
          if (j > 0) {
            a.vx -= j * a.invMass * c.nx; a.vy -= j * a.invMass * c.ny;
            b.vx += j * b.invMass * c.nx; b.vy += j * b.invMass * c.ny;
          }
        }
      }
    }

    if (merges.length) mergeAll(merges);
  }

  /* ---------- 7. 合成 ---------- */
  function mergeAll(merges) {
    for (const [a, b] of merges) {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const tier = a.tier;

      if (tier >= MAX_TIER) {          // 已经最大了 → 炸掉
        addScore(MAX_BONUS);
        burst(mx, my, tier, 46);
        state.floats.push({ x: mx, y: my - 40, t: '💥 +' + MAX_BONUS, life: 1.4 });
        state.flash = 1;
        Sound.bonus();
        continue;
      }

      const nt = tier + 1;
      const nb = makeBall(mx, my, nt, (a.vx + b.vx) / 2, (a.vy + b.vy) / 2 - 60);
      // 贴墙合成时新球更大，先夹回场内，防止一出生就穿墙
      nb.x = Math.min(Math.max(nb.x, WALL + nb.halfW), W - WALL - nb.halfW);
      nb.y = Math.min(nb.y, H - WALL - nb.botExt);
      nb.landed = true;
      nb.popAt = performance.now();
      state.balls.push(nb);

      addScore(SCORE[nt], mx, my);
      burst(mx, my, nt, 6 + nt * 3);
      Sound.merge(nt);
      if (nt === MAX_TIER) state.flash = 1;
    }
    state.balls = state.balls.filter(b => !b.dead);
  }

  function addScore(n, x, y) {
    state.score += n;
    if (state.score > state.best) {
      state.best = state.score;
      Store.set(BEST_KEY, state.best);
      bestEl.textContent = state.best;
    }
    scoreEl.textContent = state.score;
    bump(scoreEl);
    if (x !== undefined) state.floats.push({ x, y, t: '+' + n, life: 1 });
  }

  function bump(el) {
    if (!el) return;
    el.classList.remove('bump');
    void el.offsetWidth;          // 强制 reflow，让动画能重新触发
    el.classList.add('bump');
  }

  function burst(x, y, tier, n) {
    const c = FRUITS[Math.min(tier, MAX_TIER)].c;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = rand(60, 260);
      state.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
        r: rand(1.5, 4), life: 1, decay: rand(1.4, 2.4), c
      });
    }
    if (state.particles.length > 300) state.particles.splice(0, state.particles.length - 300);
  }

  /* ---------- 8. 投放 ---------- */
  function aimLimit(tier) {
    const w = halfWidthOf(tier);
    return [WALL + w + 1, W - WALL - w - 1];
  }

  function drop() {
    if (state.over || !state.ready) return;
    const [lo, hi] = aimLimit(state.pending);
    const x = Math.min(Math.max(state.aimX, lo), hi);
    state.balls.push(makeBall(x, DROP_Y, state.pending, 0, 120));
    state.ready = false;
    state.cooldown = DROP_MS / 1000;
    state.pending = state.next;
    state.next = rollTier();
    Sound.drop();
  }

  /* ---------- 9. 判负 ---------- */
  function checkOver(dt) {
    let danger = false;
    for (const b of state.balls) {
      if (b.dead || !b.landed) continue;
      if (b.y - b.topExt < DANGER_Y) {
        danger = true;
        if (b.vx * b.vx + b.vy * b.vy < REST_SPEED * REST_SPEED) {
          b.overTime += dt;
          if (b.overTime > OVER_LIMIT) { endGame(); return; }
        } else {
          b.overTime = Math.max(0, b.overTime - dt * 2);
        }
      } else {
        b.overTime = Math.max(0, b.overTime - dt * 2);
        if (b.overTime > 0) danger = true;
      }
    }
    state.danger = danger;
  }

  function endGame() {
    if (state.ended) return;
    state.over = true;
    state.ended = true;
    Sound.over();
    saveScore(state.score);
  }

  function reset() {
    state.balls.length = 0;
    state.particles.length = 0;
    state.floats.length = 0;
    state.score = 0;
    state.over = false;
    state.ended = false;
    state.ready = true;
    state.cooldown = 0;
    state.danger = false;
    state.flash = 0;
    state.aimX = W / 2;
    state.pending = rollTier();
    state.next = rollTier();
    scoreEl.textContent = '0';
    bestEl.textContent = state.best;
    closeBoard();
  }

  /* ---------- 10. 本机排行榜 ---------- */
  function readBoard() {
    try {
      const arr = JSON.parse(Store.get(BOARD_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function saveScore(s) {
    if (!(s > 0)) return;
    const list = readBoard();
    list.push({ s, t: Date.now() });
    list.sort((a, b) => b.s - a.s);
    const top = list.slice(0, 10);
    Store.set(BOARD_KEY, JSON.stringify(top));
  }

  function fmtDate(ts) {
    const d = new Date(ts);
    const p = (n) => (n < 10 ? '0' + n : '' + n);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function renderBoard() {
    const list = readBoard();
    if (!list.length) {
      boardList.innerHTML = '<div class="board-empty">还没有成绩，先玩一局吧 🌱</div>';
      return;
    }
    // 只有数字和时间，不会有 HTML 注入
    boardList.innerHTML = list.map((row, i) =>
      '<div class="board-row' + (i === 0 ? ' is-top' : '') + '">' +
        '<span class="board-rank">' + (i + 1) + '</span>' +
        '<span class="board-score">' + row.s + '</span>' +
        '<span class="board-date">' + fmtDate(row.t) + '</span>' +
      '</div>'
    ).join('');
  }

  function openBoard() {
    renderBoard();
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
  }

  function closeBoard() {
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
  }

  /* ---------- 11. 绘制 ---------- */
  function drawFruit(c, x, y, r, tier, angle, sc) {
    const f = FRUITS[tier];
    c.save();
    c.translate(x, y);
    if (sc && sc !== 1) c.scale(sc, sc);

    /* 有贴图就画人物：居中、不裁圆、不旋转。
       边长和碰撞体用同一个 spriteBox()，所以画面 = 碰撞。 */
    if (f.img) {
      const h = spriteBox(tier) * (r / FRUITS[tier].r);
      c.drawImage(f.img, -h / 2, -h / 2, h, h);
      c.restore();
      return;
    }

    c.rotate(angle || 0);

    const g = c.createRadialGradient(-r * .34, -.4 * r, r * .12, 0, 0, r * 1.1);
    g.addColorStop(0, 'rgba(255,255,255,.55)');
    g.addColorStop(.55, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(90,50,10,.20)');

    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2);
    c.fillStyle = f.c; c.fill();
    c.fillStyle = g; c.fill();

    c.font = (r * 1.72 | 0) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(f.e, 0, r * .06);
    c.restore();
  }

  function drawBoard() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#fffaf0');
    bg.addColorStop(1, '#ffe7c6');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 顶部投放区高光
    const top = ctx.createLinearGradient(0, 0, 0, 170);
    top.addColorStop(0, 'rgba(255,255,255,.75)');
    top.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = top;
    ctx.fillRect(0, 0, W, 170);

    ctx.strokeStyle = 'rgba(196,150,100,.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(WALL, 0); ctx.lineTo(WALL, H - WALL);
    ctx.lineTo(W - WALL, H - WALL); ctx.lineTo(W - WALL, 0);
    ctx.stroke();

    // 警戒线
    ctx.save();
    ctx.setLineDash([8, 8]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = state.danger
      ? 'rgba(255,70,70,' + (0.5 + 0.5 * Math.abs(Math.sin(performance.now() / 140))) + ')'
      : 'rgba(226,152,120,.5)';
    ctx.beginPath();
    ctx.moveTo(WALL, DANGER_Y); ctx.lineTo(W - WALL, DANGER_Y);
    ctx.stroke();
    ctx.restore();

    drawTopPreview();
  }

  /* 棋盘右上角的「下一个」：手机上侧栏被压成信息条，这里是唯一的提示 */
  function drawTopPreview() {
    const r = 15;
    const x = W - WALL - 30, y = 34;
    ctx.save();
    ctx.globalAlpha = .9;
    ctx.font = '600 11px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(150,110,80,.85)';
    ctx.fillText('下一个', x - r - 10, y);
    ctx.restore();
    drawFruit(ctx, x, y, r, state.next, 0, 1);
  }

  function drawBalls() {
    const now = performance.now();
    // 按 y 排序：靠前（y 大）的后画，压在上面；同等高度再按半径
    const sorted = state.balls.slice().sort((a, b) => (a.y - b.y) || (a.r - b.r));
    for (const b of sorted) {
      if (b.dead) continue;

      /* 地面投影只给程序化圆球用；人像贴图不加 ——
         那圈硬边椭圆会看起来像碰撞边缘（而且浮空时阴影错位）。 */
      if (!FRUITS[b.tier].img) {
        ctx.save();
        ctx.globalAlpha = .14;
        ctx.fillStyle = '#7a4a1e';
        ctx.beginPath();
        ctx.ellipse(b.x, H - WALL - 1, b.r * .85, Math.max(3, b.r * .16), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      let sc = 1;
      if (b.popAt) {
        const t = (now - b.popAt) / 200;
        if (t < 1) sc = 1 + .26 * (1 - t);
        else b.popAt = 0;
      }
      drawFruit(ctx, b.x, b.y, b.r, b.tier, b.angle, sc);
    }
  }

  function drawAim() {
    if (state.over) return;
    const tier = state.pending, r = FRUITS[tier].r;
    const [lo, hi] = aimLimit(tier);
    const x = Math.min(Math.max(state.aimX, lo), hi);
    const bob = Math.sin(performance.now() / 320) * 2.5;

    if (state.ready) {
      ctx.save();
      ctx.setLineDash([5, 8]);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(200,140,90,.45)';
      ctx.beginPath();
      ctx.moveTo(x, DROP_Y + r + 6); ctx.lineTo(x, H - WALL);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    if (!state.ready) ctx.globalAlpha = .4;

    /* 人像比球高 1.35 倍，直接画会被画布顶边切头。
       持握时按「刚好放得下」缩一点，脚底位置不变；投放后恢复原尺寸。 */
    let rDraw = r;
    if (FRUITS[tier].img) {
      const room = 2 * (DROP_Y - 6);          // 落点上方能放下的高度
      const box = spriteBox(tier);
      if (box > room) rDraw = r * room / box; // 放不下就缩，仍然居中
    }
    drawFruit(ctx, x, DROP_Y + bob, rDraw, tier, 0, 1);
    ctx.restore();
  }

  function drawEffects(dt) {
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.vy += 1400 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) { state.particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 18px system-ui, sans-serif';
    for (let i = state.floats.length - 1; i >= 0; i--) {
      const f = state.floats[i];
      f.life -= dt * 1.4;
      f.y -= 46 * dt;
      if (f.life <= 0) { state.floats.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, f.life);
      ctx.fillStyle = '#d2691e';
      ctx.strokeStyle = 'rgba(255,255,255,.8)';
      ctx.lineWidth = 3;
      ctx.strokeText(f.t, f.x, f.y);
      ctx.fillText(f.t, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    if (state.flash > 0) {
      ctx.globalAlpha = Math.min(.55, state.flash);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      state.flash = Math.max(0, state.flash - dt * 2.5);
    }
  }

  function drawOver() {
    if (!state.over) return;
    ctx.fillStyle = 'rgba(60,30,10,.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillText('游戏结束', W / 2, H / 2 - 54);
    ctx.font = 'bold 48px system-ui, sans-serif';
    ctx.fillText(String(state.score), W / 2, H / 2 + 6);
    ctx.font = '13px system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.fillText('最高 ' + state.best + ' · 点击或按 R 重开', W / 2, H / 2 + 58);
  }

  /* 面板里的“合成表” */
  function drawChain() {
    if (!chainCanvas) return;
    const cw = chainCanvas.width, ch = chainCanvas.height;
    chainCtx.setTransform(1, 0, 0, 1, 0, 0);
    chainCtx.clearRect(0, 0, cw, ch);

    /* 5 列 × 2 行：格子更大，缩略图看得清 */
    const COLS = 5;
    const cellW = cw / COLS;
    const cellH = ch / Math.ceil(FRUITS.length / COLS);
    const r = Math.min(cellW, cellH) * 0.42;

    for (let i = 0; i < FRUITS.length; i++) {
      const col = i % COLS;
      const row = (i / COLS) | 0;
      drawFruit(chainCtx, cellW * (col + 0.5), cellH * (row + 0.5), r, i, 0, 1);
    }
  }

  function render(dt) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawBoard();
    drawBalls();
    drawAim();
    drawEffects(dt);
    drawOver();
  }

  /* 贴图：异步加载，到位后重画面板里的「下一个 / 合成表」。
     加载失败不影响玩，继续画程序化圆球，但会在页面底部报一句 */
  let spriteFails = 0;

  function loadSprites() {
    for (const f of FRUITS) {
      if (!f.file) continue;
      const img = new Image();
      img.onload = () => {
        const ready = () => { f.img = img; drawChain(); };
        /* 等 decode 完成再交给 drawImage，避免画出没解码完的半成品 */
        if (img.decode) img.decode().then(ready, ready);
        else ready();
      };
      img.onerror = () => {
        spriteFails++;
        if (window.console) console.warn('[suika] 贴图加载失败，回退圆球：' + f.file);
        warn('有 ' + spriteFails + ' 张人物贴图没加载出来，现在显示的是备用圆球。'
           + '检查 assets/fruits/ 目录有没有跟 index.html 一起上传。');
      };
      /* 单文件版里 file 是 data URI，不能再拼查询串 */
      img.src = f.file.indexOf('data:') === 0 ? f.file : f.file + '?v=' + ASSET_VER;
    }
  }

  /* 页面底部的提示条（index.html 里有 #fatal） */
  const fatalEl = document.getElementById('fatal');
  function warn(msg) {
    if (!fatalEl) return;
    fatalEl.textContent = msg;
    fatalEl.hidden = false;
  }

  /* ---------- 12. 主循环 ---------- */
  const FIXED = 1 / 60;
  let last = 0, acc = 0;

  /* 一个固定步长：物理 + 投放冷却 + 判负。
     单独拆出来，调试时可以直接 update(1/60) 把世界快进到稳定。 */
  function update(dt) {
    if (state.over) return;
    for (let s = 0; s < SUBSTEPS; s++) substep(dt / SUBSTEPS);
    if (state.cooldown > 0) {
      state.cooldown -= dt;
      if (state.cooldown <= 0) state.ready = true;
    }
    checkOver(dt);
  }

  function frame(now) {
    const raw = (now - last) / 1000;
    last = now;
    // 切后台回来时 raw 会很大，直接丢掉，否则水果会瞬移穿墙
    const dt = Math.min(raw, 0.1);

    if (!state.over) {
      acc += dt;
      let guard = 0;
      while (acc >= FIXED && guard++ < 5) {
        update(FIXED);
        acc -= FIXED;
      }
    }
    render(dt);
    requestAnimationFrame(frame);
  }

  /* ---------- 13. 输入 ---------- */
  function toX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return ((clientX - rect.left) / rect.width) * W;
  }

  let aiming = false;

  canvas.addEventListener('pointerdown', (e) => {
    if (state.over) { reset(); return; }
    aiming = true;
    canvas.setPointerCapture(e.pointerId);
    state.aimX = toX(e.clientX);
    if (e.pointerType === 'mouse') drop();       // 鼠标：按下即投
  });

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse' || aiming) state.aimX = toX(e.clientX);
  });

  canvas.addEventListener('pointerup', (e) => {
    if (aiming && e.pointerType !== 'mouse') {   // 触屏：松手才投
      state.aimX = toX(e.clientX);
      drop();
    }
    aiming = false;
  });

  canvas.addEventListener('pointercancel', () => { aiming = false; });

  function isFormField(e) {
    const t = e.target;
    const tag = (t.tagName || '').toLowerCase();
    return tag === 'button' || tag === 'input' || tag === 'textarea';
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeBoard(); return; }
    if (isFormField(e)) return;      // 焦点在按钮上时，空格/回车交给按钮
    if (e.key === 'ArrowLeft')  { state.aimX -= 7; e.preventDefault(); }
    if (e.key === 'ArrowRight') { state.aimX += 7; e.preventDefault(); }
    if (e.key === ' ' || e.key === 'Enter') { drop(); e.preventDefault(); }
    if (e.key === 'r' || e.key === 'R') { reset(); }
  });

  /* ---------- 14. 面板按钮 ---------- */
  resetBtn.addEventListener('click', reset);
  soundBtn.addEventListener('click', () => Sound.toggle());
  boardBtn.addEventListener('click', openBoard);
  boardClose.addEventListener('click', closeBoard);
  boardAgain.addEventListener('click', reset);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeBoard(); });

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 120));

  /* ---------- 15. 启动 ---------- */
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

  state.pending = rollTier();
  state.next = rollTier();
  paintSound();
  drawChain();
  loadSprites();               // 贴图到位前先画圆球，到了自动替换
  scoreEl.textContent = '0';
  bestEl.textContent = state.best;

  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });

  // 调试钩子：控制台里能摸到状态
  window.__SUIKA__ = { state, reset, drop, FRUITS, Sound, endGame, checkOver, update, render, makeBall, spriteBox };
})();
</script>
<noscript><p style="text-align:center">这个游戏需要开启 JavaScript 才能玩。</p></noscript>
</body>
